[package]
name = "grin"
version = "5.4.0-alpha.0"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Simple, private and scalable cryptocurrency implementation based on the Mimblewimble chain format."
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin"
keywords = [ "crypto", "grin", "mimblewimble" ]
readme = "README.md"
exclude = ["**/*.grin", "**/*.grin2"]
build = "src/build/build.rs"
edition = "2018"

[workspace]
members = ["api", "chain", "config", "core", "keychain", "p2p", "servers", "store", "util", "pool"]
exclude = ["etc/gen_gen"]

[[bin]]
name = "grin"
path = "src/bin/grin.rs"

[dependencies]
blake2-rfc = "0.2"
chrono = "0.4.11"
thiserror = "1"
clap = { version = "2.33", features = ["yaml"] }
ctrlc = { version = "3.1", features = ["termination"] }
cursive_table_view = "0.15.0"
humansize = "1.1.0"
serde = "1"
serde_derive = "1"
futures = "0.3.19"
serde_json = "1"
log = "0.4"
term = "0.6"
tokio.workspace = true
anyhow.workspace = true
yosemite.workspace = true

grin_api = { path = "./api", version = "5.4.0-alpha.0" }
grin_config = { path = "./config", version = "5.4.0-alpha.0" }
grin_chain = { path = "./chain", version = "5.4.0-alpha.0" }
grin_core = { path = "./core", version = "5.4.0-alpha.0" }
grin_keychain = { path = "./keychain", version = "5.4.0-alpha.0" }
grin_p2p = { path = "./p2p", version = "5.4.0-alpha.0" }
grin_servers = { path = "./servers", version = "5.4.0-alpha.0" }
grin_util = { path = "./util", version = "5.4.0-alpha.0" }
grin_store = { path = "./store", version = "5.4.0-alpha.0" }
i2p_router = { path="./i2p_router" }

[dependencies.cursive]
version = "0.21"
default-features = false
features = ["pancurses-backend"]

[build-dependencies]
built = { version = "0.7", features = ["git2"]}

[dev-dependencies]
grin_chain = { path = "./chain", version = "5.4.0-alpha.0" }
grin_store = { path = "./store", version = "5.4.0-alpha.0" }

[workspace.dependencies]
anyhow = "1.0.98"
ed25519-dalek = { version = "2.1.1", default-features = false }
flate2 = "1.1.2"
futures = "0.3.31"
nom = { version = "7.1.3", default-features = false }
parking_lot = "0.12.4"
rand = "0.8.5"
rand_core = { version = "0.6.3", default-features = false }
reqwest = { version = "0.12.20", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
tempfile = "3.20.0"
tokio-util = { version = "0.7.15", features = ["compat"] }
tokio = { version = "1.45.1", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["chrono", "env-filter", "time"] }
tracing = { version = "0.1.41", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false }
yosemite = { version = "0.5.0", features = ["async-extra"] }
emissary-core = { git = "https://github.com/echo-enterprise/emissary", branch = "master", features = ["std"] }
emissary-util = { git = "https://github.com/echo-enterprise/emissary", branch = "master", features = ["tokio"] }

